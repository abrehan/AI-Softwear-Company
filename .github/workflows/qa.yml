name: QA Gate

on:
  push:
    branches: [main, v1.1-production-foundation]
  pull_request:
    branches: [main]

jobs:
  backend-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Compile Python
        run: python -m compileall app
      - name: Import modules and generate OpenAPI
        run: |
          python -c "import app.database; import app.main; import app.core.config; import app.core.security; import app.models.user; import app.models.project; import app.schemas.user; import app.schemas.project; import app.services.user_service; import app.services.auth_service; import app.services.project_service; import app.api.routes.users; import app.api.routes.auth; import app.api.routes.projects; spec=app.main.app.openapi(); assert len(spec.get('paths', {})) >= 9; print('QA IMPORT/OPENAPI: PASS')"
